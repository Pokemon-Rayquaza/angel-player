<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLAC Player · 深空星野 · 星璇</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sss:#c8352e;--gold:#e9a13b}
*{margin:0;padding:0;box-sizing:border-box}

#stage{position:fixed;inset:0;z-index:0;background:#05070d}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 100% at 50% 45%,transparent 42%,rgba(0,0,0,.55) 100%)}

body{
  font-family:"Noto Sans JP",sans-serif;
  color:#fff;
  background:#05070d;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:60px 20px;
  position:relative;overflow-x:hidden;
}

.wrap{width:100%;max-width:880px;position:relative;z-index:3}

h2.op{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap}
h2.op .no{font-family:monospace;font-size:12px;letter-spacing:.2em;
  color:#fff;border:1px solid rgba(255,255,255,.9);padding:3px 8px;
  background:rgba(255,255,255,.06);border-radius:4px}
h2.op .en{font-family:"Shippori Mincho",serif;font-weight:800;
  font-size:clamp(28px,4vw,44px);letter-spacing:.06em;color:#fff;
  text-shadow:0 2px 12px rgba(0,0,0,.6)}
h2.op .jp{font-family:"Noto Serif SC",serif;color:rgba(255,255,255,.9);
  font-size:15px;letter-spacing:.3em;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.lead{color:rgba(255,255,255,.92);font-size:14px;line-height:2;max-width:760px;margin-bottom:44px;
  text-shadow:0 1px 6px rgba(0,0,0,.6)}

.ultra-glass{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  border-radius:16px;
  backdrop-filter:blur(1.5px) saturate(140%) brightness(0.95);
  -webkit-backdrop-filter:blur(1.5px) saturate(140%) brightness(0.95);
  background:rgba(140,160,220,.01);
  border:1px solid rgba(180,200,255,.22);
  box-shadow:
    0 4px 20px rgba(0,0,0,.35),
    inset 0 0 0 1px rgba(255,255,255,.04),
    inset 0 0 40px rgba(0,0,0,.15);
}

.ultra-glass::before{
  content:"";
  position:absolute;
  inset:-30%;
  border-radius:50%;
  background:conic-gradient(
    from 0deg,
    rgba(120,150,255,.04),
    rgba(80,200,255,.025),
    rgba(180,120,255,.035),
    rgba(100,255,220,.02),
    rgba(120,150,255,.04)
  );
  animation:liquid-flow 18s linear infinite;
  filter:blur(50px);
  z-index:0;
  pointer-events:none;
  opacity:.4;
}

@keyframes liquid-flow{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

.stardust-layer{
  position:absolute;
  inset:0;
  border-radius:inherit;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}

.stardust-layer::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(1px 1px at 8% 12%, rgba(255,255,255,.7), transparent),
    radial-gradient(1px 1px at 22% 68%, rgba(200,220,255,.55), transparent),
    radial-gradient(1.5px 1.5px at 35% 28%, rgba(255,255,255,.65), transparent),
    radial-gradient(1px 1px at 48% 82%, rgba(180,210,255,.5), transparent),
    radial-gradient(1px 1px at 62% 18%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 75% 55%, rgba(220,200,255,.55), transparent),
    radial-gradient(1px 1px at 88% 35%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 15% 92%, rgba(200,220,255,.55), transparent),
    radial-gradient(1.5px 1.5px at 55% 5%, rgba(255,255,255,.65), transparent),
    radial-gradient(1px 1px at 92% 78%, rgba(180,210,255,.5), transparent),
    radial-gradient(1px 1px at 30% 45%, rgba(255,255,255,.55), transparent),
    radial-gradient(1.5px 1.5px at 68% 92%, rgba(220,200,255,.5), transparent),
    radial-gradient(1px 1px at 42% 62%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 80% 8%, rgba(200,220,255,.55), transparent),
    radial-gradient(1.5px 1.5px at 5% 48%, rgba(255,255,255,.6), transparent),
    radial-gradient(1px 1px at 52% 35%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 95% 52%, rgba(200,220,255,.5), transparent);
  opacity:.7;
  animation:dust-twinkle 3.5s ease-in-out infinite alternate;
}

.stardust-layer::after{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(2px 2px at 18% 35%, rgba(255,255,255,.65), transparent),
    radial-gradient(2px 2px at 72% 25%, rgba(200,220,255,.5), transparent),
    radial-gradient(2px 2px at 45% 75%, rgba(255,240,220,.55), transparent),
    radial-gradient(2px 2px at 85% 65%, rgba(220,200,255,.5), transparent),
    radial-gradient(2px 2px at 32% 8%, rgba(255,255,255,.6), transparent),
    radial-gradient(2px 2px at 60% 48%, rgba(200,230,255,.5), transparent),
    radial-gradient(2px 2px at 10% 72%, rgba(255,255,255,.55), transparent),
    radial-gradient(2px 2px at 95% 12%, rgba(220,200,255,.6), transparent),
    radial-gradient(2px 2px at 50% 60%, rgba(255,255,255,.5), transparent),
    radial-gradient(2px 2px at 25% 88%, rgba(200,220,255,.55), transparent);
  opacity:.55;
  animation:dust-twinkle 5s ease-in-out infinite alternate-reverse;
}

@keyframes dust-twinkle{
  0%{opacity:.3; transform:translateY(0) scale(1)}
  100%{opacity:.75; transform:translateY(-2px) scale(1.02)}
}

.ultra-glass:hover .stardust-layer::before{
  transform:translate(
    calc(var(--mx-px, 0) * 6px),
    calc(var(--my-px, 0) * 6px)
  );
}
.ultra-glass:hover .stardust-layer::after{
  transform:translate(
    calc(var(--mx-px, 0) * -4px),
    calc(var(--my-px, 0) * -4px)
  );
}
.stardust-layer::before,
.stardust-layer::after{
  transition:transform .4s ease-out;
}

.player, .tracks{
  position:relative;
}

.player > *, .tracks > li{
  position:relative;
  z-index:3;
}

.player{
  display:flex;gap:34px;align-items:center;flex-wrap:wrap;
  padding:30px;margin-bottom:26px;
}

.disc{width:170px;height:170px;border-radius:50%;flex:none;
  background:repeating-radial-gradient(circle,#111 0 3px,#232323 3px 6px);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 6px rgba(13,20,32,.7),0 10px 30px rgba(0,0,0,.5)}
.disc i{width:56px;height:56px;border-radius:50%;background:var(--sss);
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-family:"Shippori Mincho",serif;font-size:15px;font-style:normal}
.disc.spin{animation:rot 5s linear infinite;animation-play-state:running}
.disc.spin.paused{animation-play-state:paused}
@keyframes rot{to{transform:rotate(360deg)}}

.np{flex:1;min-width:240px}
.np .tag{font-size:11px;letter-spacing:.3em;color:var(--gold);
  text-shadow:0 1px 4px rgba(0,0,0,.6)}
.np .ttl{font-family:"Shippori Mincho",serif;font-size:26px;
  margin:8px 0 4px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 2px 8px rgba(0,0,0,.6)}
.np .art{font-size:13px;color:rgba(255,255,255,.75);margin-bottom:16px;
  text-shadow:0 1px 4px rgba(0,0,0,.6)}

.eq{display:flex;gap:4px;height:26px;align-items:flex-end;margin-bottom:14px}
.eq i{width:5px;background:var(--gold);height:20%;
  animation:eq .7s infinite ease-in-out;animation-play-state:paused;
  box-shadow:0 0 8px rgba(233,161,59,.6)}
.player.playing .eq i{animation-play-state:running}
.eq i:nth-child(2){animation-delay:.15s}
.eq i:nth-child(3){animation-delay:.3s}
.eq i:nth-child(4){animation-delay:.45s}
.eq i:nth-child(5){animation-delay:.1s}
@keyframes eq{0%{height:18%}50%{height:100%}100%{height:32%}}

.bar{height:4px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden;
  position:relative;cursor:pointer;margin-top:4px}
.bar i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),var(--sss));
  box-shadow:0 0 8px rgba(233,161,59,.5)}
.bar .time{position:absolute;right:0;top:-22px;font-size:11px;color:rgba(255,255,255,.75);
  text-shadow:0 1px 4px rgba(0,0,0,.6)}

.tracks{
  list-style:none;
  border-radius:12px;overflow:hidden;
  max-height:460px;overflow-y:auto;
}
.tracks li{display:flex;gap:16px;align-items:baseline;
  padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.12);
  cursor:pointer;font-size:14px;transition:.25s;color:#fff;
  text-shadow:0 1px 4px rgba(0,0,0,.5)}
.tracks li:last-child{border-bottom:none}
.tracks li:hover{background:rgba(255,255,255,.08);padding-left:26px}
.tracks li.on{color:var(--gold);text-shadow:0 1px 6px rgba(0,0,0,.7)}
.tracks .n{font-family:monospace;font-size:11px;color:rgba(255,255,255,.5);width:30px;flex:none}
.tracks .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tracks .a{margin-left:auto;font-size:12px;color:rgba(255,255,255,.65);flex:none}

.tracks::-webkit-scrollbar{width:8px}
.tracks::-webkit-scrollbar-track{background:transparent}
.tracks::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:4px}
</style>
</head>
<body>

<div id="stage"></div>
<div id="vig"></div>

<div class="wrap">
  <h2 class="op">
    <span class="no">MUSIC</span>
    <span class="en">FLAC Player</span>
    <span class="jp">音楽フォルダ</span>
  </h2>
  <p class="lead">  <b> </b>， 支持 FLAC / MP3。</p>

  <div class="player ultra-glass" id="player">
    <div class="stardust-layer"></div>
    <div class="disc" id="disc"><i>FLAC</i></div>
    <div class="np">
      <div class="tag" id="npTag">正在加载默认目录...</div>
      <div class="ttl" id="npTtl">—</div>
      <div class="art" id="npArt">默认使用用户音乐目录下的 Music 文件夹，可通过环境变量 ANGEL_PLAYER_MUSIC_DIR 覆盖</div>
      <div class="eq"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="bar" id="bar">
        <i id="barFill"></i>
        <span class="time" id="timeText">00:00 / 00:00</span>
      </div>
    </div>
  </div>

  <ul class="tracks ultra-glass" id="tracks">
    <div class="stardust-layer"></div>
    <li style="justify-content:center;color:rgba(255,255,255,.55);cursor:default">正在加载...</li>
  </ul>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
// ============================================================
// 深空星野背景 + 移动黑洞 + 土星环星 + 星璇
// ============================================================
(() => {
  const stage = document.getElementById('stage');
  const TAU = Math.PI * 2;
  const clamp = (v,a,b) => v<a?a:v>b?b:v;
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  const cv = document.createElement('canvas');
  stage.appendChild(cv);
  const c = cv.getContext('2d');
  let W=0, H=0, dpr=1;
  const api = { nx:.5, ny:.5 };

  const P = {
    density: 1,
    parallax: 1,
    meteor: 0.9,
    twinkle: 0.5
  };

  const rnd = mulberry32(9021);
  let stars=[], met=[], galaxies=[], nebulaFlashes=[], galaxyBand=[], ringStars=[];

  const blackHole = {
    nx: 0.5,
    ny: 0.5,
    targetNx: 0.5,
    targetNy: 0.5,
    moveSpeed: 0.000012,
    coreR: 7,
    diskR: 30,
    haloR: 55,
    coreRpx: 7,
    diskRpx: 30,
    haloRpx: 55,
    rot: 0,
    rotSpeed: 0.00012,
    cx: 0,
    cy: 0,
    nextTargetTime: 0,
    influenceMul: 1.0,
    curvature: 0.06
  };

  function randomBlackHoleTarget() {
    const zones = [
      { xMin: 0.05, xMax: 0.25, yMin: 0.05, yMax: 0.35 },
      { xMin: 0.75, xMax: 0.95, yMin: 0.05, yMax: 0.35 },
      { xMin: 0.05, xMax: 0.25, yMin: 0.65, yMax: 0.95 },
      { xMin: 0.75, xMax: 0.95, yMin: 0.65, yMax: 0.95 }
    ];
    const z = zones[Math.floor(rnd() * zones.length)];
    return {
      nx: z.xMin + rnd() * (z.xMax - z.xMin),
      ny: z.yMin + rnd() * (z.yMax - z.yMin)
    };
  }

  const NEBULAE = [
    { xR:.22, yR:.20, sizeR:.75, hue:220, sat:70, lit:60, alpha:.16, speed:  .00040, driftX: 12, driftY:  -8, phase: 0 },
    { xR:.78, yR:.25, sizeR:.60, hue:260, sat:75, lit:55, alpha:.14, speed:  .00032, driftX:-15, driftY:  10, phase: 1.5 },
    { xR:.50, yR:.85, sizeR:.65, hue:200, sat:80, lit:58, alpha:.13, speed:  .00045, driftX:  8, driftY: -12, phase: 3.0 },
    { xR:.15, yR:.75, sizeR:.55, hue:320, sat:70, lit:60, alpha:.12, speed:  .00038, driftX:-10, driftY:  -6, phase: 0.8 },
    { xR:.85, yR:.78, sizeR:.50, hue:  0, sat:65, lit:58, alpha:.11, speed:  .00050, driftX: 14, driftY:   8, phase: 2.2 },
    { xR:.70, yR:.55, sizeR:.45, hue:170, sat:75, lit:60, alpha:.10, speed:  .00055, driftX: -8, driftY:  12, phase: 4.0 },
    { xR:.35, yR:.45, sizeR:.48, hue:290, sat:70, lit:58, alpha:.11, speed:  .00042, driftX: 10, driftY: -10, phase: 5.2 },
    { xR:.55, yR:.15, sizeR:.42, hue:190, sat:78, lit:60, alpha:.10, speed:  .00048, driftX:-12, driftY:  -5, phase: 1.0 },
    { xR:.08, yR:.50, sizeR:.40, hue:340, sat:72, lit:58, alpha:.10, speed:  .00035, driftX:  9, driftY:   6, phase: 2.8 },
    { xR:.92, yR:.45, sizeR:.38, hue:140, sat:70, lit:60, alpha:.09, speed:  .00052, driftX: -7, driftY: -10, phase: 3.7 }
  ];

  let mouseTrail = [];
  let lastMouseX = null, lastMouseY = null;
  let lastEmitTime = 0;

  addEventListener('pointermove', e => {
    api.nx = e.clientX/innerWidth;
    api.ny = e.clientY/innerHeight;
    const x = e.clientX, y = e.clientY;
    const now = performance.now();

    if (lastMouseX === null) {
      lastMouseX = x; lastMouseY = y; lastEmitTime = now;
      return;
    }

    const dx = x - lastMouseX, dy = y - lastMouseY;
    const dist = Math.hypot(dx, dy);

    let count;
    if (dist < 1) {
      count = 1;
    } else {
      count = Math.min(4, Math.max(1, Math.floor(dist / 10)));
    }

    for (let i = 0; i < count; i++) {
      const t = count === 1 ? 0 : i / (count - 1);
      mouseTrail.push({
        x: lastMouseX + dx * t,
        y: lastMouseY + dy * t,
        life: 1,
        size: .8 + rnd() * 1.4,
        hue: 200 + rnd() * 60,
        vx: (rnd() - .5) * .3,
        vy: (rnd() - .5) * .3 - .2
      });
    }

    lastMouseX = x; lastMouseY = y; lastEmitTime = now;
  }, {passive:true});

  setInterval(() => {
    if (lastMouseX === null) return;
    const now = performance.now();
    if (now - lastEmitTime > 150) {
      mouseTrail.push({
        x: lastMouseX + (rnd() - .5) * 6,
        y: lastMouseY + (rnd() - .5) * 6,
        life: 1,
        size: .6 + rnd() * 1.2,
        hue: 200 + rnd() * 60,
        vx: (rnd() - .5) * .4,
        vy: (rnd() - .5) * .4 - .3
      });
    }
  }, 80);

  function build() {
    stars = [];

    galaxyBand = [];
    const bandCount = Math.round((W + H) * 0.35);
    const bandAngle = -0.42;
    const bandCenterX = W * 0.5;
    const bandCenterY = H * 0.5;
    const bandWidth = W * 0.22;
    for (let i = 0; i < bandCount; i++) {
      const along = (rnd() - .5) * (W + H) * 0.75;
      const across = (rnd() + rnd() + rnd() - 1.5) / 1.5 * bandWidth * 0.5;
      const cosA = Math.cos(bandAngle), sinA = Math.sin(bandAngle);
      const x = bandCenterX + along * cosA - across * sinA;
      const y = bandCenterY + along * sinA + across * cosA;
      if (x < -50 || x > W+50 || y < -50 || y > H+50) continue;
      galaxyBand.push({
        x, y,
        r: .3 + rnd() * .7,
        a: .04 + rnd() * .12,
        ph: rnd() * TAU,
        sp: .5 + rnd() * 1.5
      });
    }

    const base = Math.round(W*H/2400*P.density);
    for (let li=0; li<5; li++) {
      const z = li/4, n = Math.round(base*Math.pow(1.75,li)/5.2);
      for (let i=0; i<n; i++) {
        const big = z>.72 && rnd()<.05;
        stars.push({
          x: rnd()*W, y: rnd()*H, z,
          r: (.3+z*1.05)*(big?2.4:1)*(.6+rnd()*.8),
          a: .2+z*.55+(big?.35:0),
          ph: rnd()*TAU, sp: .4+rnd()*2.4,
          vx: -(.05+z*.55)*(.3+rnd()*.8), vy: (rnd()-.5)*.06,
          c: big ? (rnd()<.5?'190,215,255':'255,214,178') : '255,255,255'
        });
      }
    }

    ringStars = [];
    const ringCount = 4 + Math.floor(rnd() * 3);
    for (let i = 0; i < ringCount; i++) {
      const z = 0.3 + rnd() * 0.6;
      const size = (2.5 + rnd() * 3.5) * 0.7;
      ringStars.push({
        x: rnd() * W,
        y: rnd() * H,
        z,
        size,
        ringInner: size * 1.6 + rnd() * 1.2,
        ringOuter: size * 3.0 + rnd() * 2.2,
        tiltX: (rnd() - .5) * 1.2,
        tiltZ: (rnd() - .5) * 0.8,
        tiltSpeedX: (rnd() - .5) * 0.00008,
        tiltSpeedZ: (rnd() - .5) * 0.00006,
        tiltPhaseX: rnd() * TAU,
        tiltPhaseZ: rnd() * TAU,
        rot: rnd() * TAU,
        rotSpeed: (rnd() - .5) * 0.0001,
        hue: 200 + rnd() * 80,
        alpha: .3 + rnd() * .25,
        phase: rnd() * TAU,
        vx: -(.05+z*.55)*(.3+rnd()*.8) * 0.4,
        vy: (rnd()-.5)*.06 * 0.4
      });
    }

    galaxies = [];
    const galaxyCount = 3 + Math.floor(rnd() * 3);
    for (let i = 0; i < galaxyCount; i++) {
      const armCount = 2 + Math.floor(rnd() * 3);
      const armStars = 22 + Math.floor(rnd() * 12);
      const armPoints = [];
      for (let a = 0; a < armCount; a++) {
        const armAngle = (a / armCount) * TAU;
        for (let j = 0; j < armStars; j++) {
          const t = j / armStars;
          const spiralAngle = armAngle + t * 2.6;
          const baseR = t * (0.85 + rnd() * 0.15);
          const scatter = (1 - t) * 0.12 + 0.03;
          const r = baseR + (rnd() - .5) * scatter;
          const angleOffset = (rnd() - .5) * 0.35 * (0.4 + t * 0.6);
          const finalAngle = spiralAngle + angleOffset;
          armPoints.push({
            x: Math.cos(finalAngle) * r,
            y: Math.sin(finalAngle) * r,
            r: 0.5 + rnd() * 1.3,
            a: 0.3 + rnd() * 0.5,
            hueOffset: (rnd() - .5) * 40
          });
        }
      }

      galaxies.push({
        x: rnd() * W,
        y: rnd() * H,
        size: 22 + rnd() * 40,
        rot: rnd() * TAU,
        rotSpeed: (rnd() - .5) * 0.00006,
        tiltX: 0.4 + rnd() * 0.5,
        tiltZ: (rnd() - .5) * 0.6,
        hue: 200 + rnd() * 100,
        alpha: 0.25 + rnd() * 0.2,
        armPoints,
        coreR: 0.12 + rnd() * 0.08,
        phase: rnd() * TAU,
        drift: 0.5 + rnd() * 0.5
      });
    }

    nebulaFlashes = [];
    met = [];

    const target = randomBlackHoleTarget();
    blackHole.nx = target.nx;
    blackHole.ny = target.ny;
    blackHole.targetNx = target.nx;
    blackHole.targetNy = target.ny;
    blackHole.nextTargetTime = 0;
  }

  function fit() {
    dpr = Math.min(2, window.devicePixelRatio||1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    c.setTransform(dpr,0,0,dpr,0,0);
    build();
  }
  fit();
  window.addEventListener('resize', () => {
    clearTimeout(fit._t);
    fit._t = setTimeout(fit, 160);
  });

  let lastT = performance.now();
  let nextFlashTime = 8000;

  function updateBlackHole(t) {
    const bh = blackHole;

    const dx = bh.targetNx - bh.nx;
    const dy = bh.targetNy - bh.ny;
    const dist = Math.hypot(dx, dy);

    if (dist < 0.015 || t > bh.nextTargetTime) {
      const target = randomBlackHoleTarget();
      bh.targetNx = target.nx;
      bh.targetNy = target.ny;
      bh.nextTargetTime = t + 40000 + rnd() * 60000;
    }

    const speed = bh.moveSpeed * 16;
    const stepFactor = Math.min(1, Math.sqrt(dist) * 3);
    bh.nx += dx * speed * stepFactor;
    bh.ny += dy * speed * stepFactor;

    bh.cx = W * bh.nx;
    bh.cy = H * bh.ny;

    const scale = Math.min(W, H) / 900;
    bh.coreRpx = bh.coreR * scale;
    bh.diskRpx = bh.diskR * scale;
    bh.haloRpx = bh.haloR * scale;

    bh.rot += bh.rotSpeed * 16;
  }

  function lensStretch(sx, sy, bh) {
    const dx = sx - bh.cx;
    const dy = sy - bh.cy;
    const dist = Math.sqrt(dx*dx + dy*dy);

    const influenceR = bh.haloRpx * bh.influenceMul;

    if (dist > influenceR || dist < 1) {
      return { stretch: 0, angle: 0, bend: 0, dist, inside: false };
    }

    const u = dist / influenceR;
    const strength = Math.pow(1 - u * u, 2);

    const nearBoost = 1 + (1 - u) * 3.5;
    const stretch = strength * nearBoost * 5.5;

    const nx = dx / dist;
    const ny = dy / dist;
    const angle = Math.atan2(nx, -ny);

    return { stretch, angle, bend: strength, dist, inside: true };
  }

  function drawBlackHole(bh) {
    const cx = bh.cx;
    const cy = bh.cy;
    const coreR = bh.coreRpx;
    const diskR = bh.diskRpx;
    const haloR = bh.haloRpx;

    const halo = c.createRadialGradient(cx, cy, coreR * 0.5, cx, cy, haloR);
    halo.addColorStop(0, 'rgba(0,0,0,0)');
    halo.addColorStop(.35, 'rgba(120,150,255,.03)');
    halo.addColorStop(.55, 'rgba(100,130,220,.025)');
    halo.addColorStop(.78, 'rgba(80,110,200,.015)');
    halo.addColorStop(1, 'transparent');
    c.fillStyle = halo;
    c.beginPath();
    c.arc(cx, cy, haloR, 0, TAU);
    c.fill();

    c.save();
    c.translate(cx, cy);
    c.rotate(bh.rot * 0.4);
    for (let i = 0; i < 3; i++) {
      const rr = coreR * (1.3 + i * 0.22);
      c.strokeStyle = `rgba(180,200,255,${0.12 - i * 0.03})`;
      c.lineWidth = 0.7;
      c.beginPath();
      c.ellipse(0, 0, rr, rr * 0.4, 0, 0, TAU);
      c.stroke();
    }
    c.restore();

    c.save();
    c.translate(cx, cy);
    c.rotate(bh.rot * 0.25);
    c.scale(1, 0.35);

    const diskGrad = c.createRadialGradient(0, 0, coreR * 1.1, 0, 0, diskR);
    diskGrad.addColorStop(0, 'rgba(200,220,255,.10)');
    diskGrad.addColorStop(.4, 'rgba(150,180,255,.06)');
    diskGrad.addColorStop(.75, 'rgba(120,140,220,.03)');
    diskGrad.addColorStop(1, 'transparent');
    c.fillStyle = diskGrad;
    c.beginPath();
    c.arc(0, 0, diskR, 0, TAU);
    c.fill();

    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU + bh.rot * 0.7;
      const rr = coreR * (1.5 + i * 0.06);
      const arcLen = 0.6 + 0.4 * Math.sin(i * 2.7);
      const alpha = 0.06 + 0.04 * Math.sin(i * 1.9 + bh.rot * 2);
      c.strokeStyle = `rgba(190,210,255,${alpha})`;
      c.lineWidth = 0.6;
      c.beginPath();
      c.arc(0, 0, rr, a, a + arcLen);
      c.stroke();
    }
    c.restore();

    const ring = c.createRadialGradient(cx, cy, coreR * 0.8, cx, cy, coreR * 2.0);
    ring.addColorStop(0, 'rgba(180,200,255,.18)');
    ring.addColorStop(.5, 'rgba(140,170,240,.06)');
    ring.addColorStop(1, 'transparent');
    c.fillStyle = ring;
    c.beginPath();
    c.arc(cx, cy, coreR * 2.0, 0, TAU);
    c.fill();

    const core = c.createRadialGradient(cx, cy, 0, cx, cy, coreR);
    core.addColorStop(0, 'rgba(0,0,0,1)');
    core.addColorStop(.85, 'rgba(0,0,0,1)');
    core.addColorStop(1, 'rgba(0,0,0,.95)');
    c.fillStyle = core;
    c.beginPath();
    c.arc(cx, cy, coreR, 0, TAU);
    c.fill();

    c.strokeStyle = 'rgba(200,215,255,.35)';
    c.lineWidth = 0.6;
    c.beginPath();
    c.arc(cx, cy, coreR, 0, TAU);
    c.stroke();
  }

  function drawRingStar(rs, t, ox, oy) {
    if (!RM) {
      rs.x += rs.vx * 0.016 * 22;
      rs.y += rs.vy * 0.016 * 22;
      if (rs.x < -60) rs.x = W + 60;
      if (rs.x > W + 60) rs.x = -60;
      if (rs.y < -60) rs.y = H + 60;
      if (rs.y > H + 60) rs.y = -60;
    }

    const px = rs.x + ox * (rs.z * 0.9 + 0.1);
    const py = rs.y + oy * (rs.z * 0.9 + 0.1);

    const tiltX = rs.tiltX + Math.sin(t * rs.tiltSpeedX + rs.tiltPhaseX) * 0.5;
    const tiltZ = rs.tiltZ + Math.cos(t * rs.tiltSpeedZ + rs.tiltPhaseZ) * 0.4;
    const squash = Math.cos(tiltX);

    c.save();
    c.translate(px, py);
    c.rotate(tiltZ);

    const hue = rs.hue;
    const alpha = rs.alpha;

    const particleCount = 30;
    for (let i = 0; i < particleCount; i++) {
      const a = (i / particleCount) * TAU;
      const ringR = rs.ringInner + (rs.ringOuter - rs.ringInner) * (0.3 + 0.7 * rnd());
      const ex = Math.cos(a) * ringR;
      const ey = Math.sin(a) * ringR * squash;
      const pr = 0.25 + rnd() * 0.5;
      const ringMid = (rs.ringInner + rs.ringOuter) / 2;
      const distFromMid = Math.abs(ringR - ringMid) / ((rs.ringOuter - rs.ringInner) / 2);
      const a1 = alpha * (1 - distFromMid * 0.6) * 0.5;
      c.fillStyle = `hsla(${hue}, 55%, 88%, ${a1})`;
      c.beginPath();
      c.arc(ex, ey, pr, 0, TAU);
      c.fill();
    }

    const innerCount = 18;
    for (let i = 0; i < innerCount; i++) {
      const a = (i / innerCount) * TAU;
      const ringR = rs.ringInner * (0.6 + 0.4 * rnd());
      const ex = Math.cos(a) * ringR;
      const ey = Math.sin(a) * ringR * squash;
      c.fillStyle = `hsla(${hue}, 50%, 90%, ${alpha * 0.25})`;
      c.beginPath();
      c.arc(ex, ey, 0.25 + rnd() * 0.35, 0, TAU);
      c.fill();
    }

    const planetR = rs.size;
    const pg = c.createRadialGradient(-planetR * 0.3, -planetR * 0.3, 0, 0, 0, planetR);
    pg.addColorStop(0, `hsla(${hue}, 50%, 92%, ${alpha})`);
    pg.addColorStop(.7, `hsla(${hue}, 45%, 70%, ${alpha * 0.8})`);
    pg.addColorStop(1, `hsla(${hue}, 40%, 55%, ${alpha * 0.6})`);
    c.fillStyle = pg;
    c.beginPath();
    c.arc(0, 0, planetR, 0, TAU);
    c.fill();

    c.strokeStyle = `hsla(${hue}, 60%, 90%, ${alpha * 0.3})`;
    c.lineWidth = 0.4;
    c.beginPath();
    c.arc(0, 0, planetR, 0, TAU);
    c.stroke();

    c.restore();
  }

  function drawGalaxy(gal, t, ox, oy) {
    if (!RM) {
      gal.rot += gal.rotSpeed * 16;
    }

    const drift = Math.sin(t * 0.0002 + gal.phase) * 1;
    const px = gal.x + ox * gal.drift + drift * 4;
    const py = gal.y + oy * gal.drift;

    const size = gal.size;
    const alpha = gal.alpha;

    c.save();
    c.translate(px, py);
    c.rotate(gal.rot);
    c.rotate(gal.tiltZ);
    c.scale(1, Math.cos(gal.tiltX));

    const halo = c.createRadialGradient(0, 0, 0, 0, 0, size * 1.1);
    halo.addColorStop(0, `hsla(${gal.hue}, 60%, 75%, ${alpha * 0.15})`);
    halo.addColorStop(0.5, `hsla(${gal.hue}, 55%, 65%, ${alpha * 0.06})`);
    halo.addColorStop(1, 'transparent');
    c.fillStyle = halo;
    c.beginPath();
    c.arc(0, 0, size * 1.1, 0, TAU);
    c.fill();

    for (const p of gal.armPoints) {
      const x = p.x * size;
      const y = p.y * size;
      const r = p.r;
      const a = p.a * alpha;
      const hue = gal.hue + p.hueOffset;

      c.fillStyle = `hsla(${hue}, 65%, 85%, ${a})`;
      c.beginPath();
      c.arc(x, y, r, 0, TAU);
      c.fill();

      if (r > 1.2) {
        c.fillStyle = `hsla(${hue}, 70%, 80%, ${a * 0.3})`;
        c.beginPath();
        c.arc(x, y, r * 2.5, 0, TAU);
        c.fill();
      }
    }

    const coreR = gal.coreR * size;
    const core = c.createRadialGradient(0, 0, 0, 0, 0, coreR);
    core.addColorStop(0, `hsla(${gal.hue}, 70%, 95%, ${alpha * 0.9})`);
    core.addColorStop(0.4, `hsla(${gal.hue}, 65%, 80%, ${alpha * 0.5})`);
    core.addColorStop(1, 'transparent');
    c.fillStyle = core;
    c.beginPath();
    c.arc(0, 0, coreR, 0, TAU);
    c.fill();

    const coreWarm = c.createRadialGradient(0, 0, 0, 0, 0, coreR * 1.6);
    coreWarm.addColorStop(0, `hsla(${(gal.hue + 30) % 360}, 75%, 88%, ${alpha * 0.4})`);
    coreWarm.addColorStop(1, 'transparent');
    c.fillStyle = coreWarm;
    c.beginPath();
    c.arc(0, 0, coreR * 1.6, 0, TAU);
    c.fill();

    if (gal.armPoints.length > 25) {
      c.globalCompositeOperation = 'destination-out';
      const dustCount = 4;
      for (let i = 0; i < dustCount; i++) {
        const da = (i / dustCount) * TAU + gal.rot * 0.3;
        const dRad = size * (0.3 + rnd() * 0.4);
        const dx = Math.cos(da) * dRad;
        const dy = Math.sin(da) * dRad * 0.5;
        const dr = size * 0.12;
        const dg = c.createRadialGradient(dx, dy, 0, dx, dy, dr);
        dg.addColorStop(0, 'rgba(0,0,0,0.35)');
        dg.addColorStop(1, 'transparent');
        c.fillStyle = dg;
        c.beginPath();
        c.arc(dx, dy, dr, 0, TAU);
        c.fill();
      }
      c.globalCompositeOperation = 'source-over';
    }

    c.restore();
  }

  function frame(t) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (t - lastT) / 1000);
    lastT = t;

    c.clearRect(0,0,W,H);

    const oxSlow = (api.nx-.5)*-12*P.parallax;
    const oySlow = (api.ny-.5)*-8*P.parallax;
    const oxMid  = (api.nx-.5)*-40*P.parallax;
    const oyMid  = (api.ny-.5)*-26*P.parallax;
    const oxFar  = (api.nx-.5)*-20*P.parallax;
    const oyFar  = (api.ny-.5)*-13*P.parallax;
    // ★ 星璇专用：极远视差层（几乎不动）
    const oxDeepest = (api.nx-.5)*-28*P.parallax;
    const oyDeepest = (api.ny-.5)*-22*P.parallax;
    const oxFast = (api.nx-.5)*-70*P.parallax;
    const oyFast = (api.ny-.5)*-45*P.parallax;

    const globalBreath = 0.88 + Math.sin(t * 0.00018) * 0.12;

    updateBlackHole(t);
    const bh = blackHole;

    // ===== 1. 星璇（最底层，最先画） =====
    c.globalCompositeOperation = 'screen';
    for (const gal of galaxies) {
      drawGalaxy(gal, t, oxDeepest, oyDeepest);
    }
    c.globalAlpha = 1;

    // ===== 2. 银河带 =====
    for (const gs of galaxyBand) {
      const tw = .7 + .3 * Math.sin(t*.001*gs.sp + gs.ph);
      const x = gs.x + oxFar*.5;
      const y = gs.y + oyFar*.5;
      c.globalAlpha = gs.a * tw * globalBreath;
      c.fillStyle = 'rgba(220,230,255,1)';
      c.beginPath();
      c.arc(x, y, gs.r, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;

    // ===== 3. 星云 =====
    for (let i = 0; i < NEBULAE.length; i++) {
      const n = NEBULAE[i];

      const breath = 1 + Math.sin(t * n.speed + n.phase) * 0.18;
      const hueShift = Math.sin(t * n.speed * 0.7 + n.phase * 1.3) * 18;
      const drift = Math.sin(t * n.speed * 0.5 + n.phase) * 1;
      const px = W * n.xR + oxSlow * (0.3 + i * 0.03) + drift * n.driftX;
      const py = H * n.yR + oySlow * (0.3 + i * 0.03) + drift * n.driftY;
      const size = W * n.sizeR * breath;

      const hue = (n.hue + hueShift + 360) % 360;
      const color = `hsla(${hue}, ${n.sat}%, ${n.lit}%, ${n.alpha * breath * globalBreath})`;

      const g = c.createRadialGradient(px, py, 0, px, py, size);
      g.addColorStop(0, color);
      g.addColorStop(.45, `hsla(${hue}, ${n.sat}%, ${n.lit}%, ${n.alpha * breath * 0.5 * globalBreath})`);
      g.addColorStop(1, 'transparent');
      c.fillStyle = g;
      c.beginPath();
      c.arc(px, py, size, 0, TAU);
      c.fill();

      c.globalCompositeOperation = 'destination-out';
      const darkCount = 3;
      for (let k = 0; k < darkCount; k++) {
        const da = t * n.speed * 0.6 + k * 2.1 + n.phase;
        const ddx = Math.cos(da) * size * 0.4;
        const ddy = Math.sin(da * 0.7) * size * 0.35;
        const dr = size * 0.28;
        const dalpha = 0.05 + 0.03 * Math.sin(t * 0.0005 + k + i);
        const dg = c.createRadialGradient(
          px + ddx, py + ddy, 0,
          px + ddx, py + ddy, dr
        );
        dg.addColorStop(0, `rgba(0,0,0,${dalpha})`);
        dg.addColorStop(1, 'transparent');
        c.fillStyle = dg;
        c.beginPath();
        c.arc(px + ddx, py + ddy, dr, 0, TAU);
        c.fill();
      }
      c.globalCompositeOperation = 'screen';
    }

    // ===== 4. 暗尘带 =====
    c.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 5; i++) {
      const angle = -0.35 + i * 0.18 + Math.sin(t * 0.0001 + i) * 0.06;
      const offset = (i - 2) * H * 0.08;
      const cx = W * 0.5 + Math.cos(angle) * offset;
      const cy = H * 0.5 + Math.sin(angle) * offset;
      const len = W * 0.9;
      const wid = H * 0.06;
      c.save();
      c.translate(cx, cy);
      c.rotate(angle);
      const dg = c.createLinearGradient(-len/2, 0, len/2, 0);
      dg.addColorStop(0, 'rgba(0,0,0,0)');
      dg.addColorStop(.5, 'rgba(0,0,0,0.045)');
      dg.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = dg;
      c.fillRect(-len/2, -wid/2, len, wid);
      c.restore();
    }
    c.globalCompositeOperation = 'screen';

    // ===== 5. 星云闪现 =====
    if (!RM && t > nextFlashTime) {
      if (nebulaFlashes.length < 3) {
        nebulaFlashes.push({
          x: rnd() * W,
          y: rnd() * H,
          size: W * (0.15 + rnd() * 0.15),
          hue: rnd() * 360,
          life: 0,
          maxLife: 6 + rnd() * 6,
          phase: rnd() * TAU
        });
      }
      nextFlashTime = t + 15000 + rnd() * 25000;
    }
    for (let i = nebulaFlashes.length - 1; i >= 0; i--) {
      const f = nebulaFlashes[i];
      f.life += dt;
      if (f.life > f.maxLife) { nebulaFlashes.splice(i,1); continue; }
      const p = f.life / f.maxLife;
      const fade = Math.sin(p * Math.PI);
      const alpha = 0.08 * fade * globalBreath;
      const px = f.x + oxSlow * 0.5;
      const py = f.y + oySlow * 0.5;
      const sz = f.size * (0.7 + fade * 0.5);
      const g = c.createRadialGradient(px, py, 0, px, py, sz);
      g.addColorStop(0, `hsla(${f.hue}, 75%, 65%, ${alpha})`);
      g.addColorStop(.5, `hsla(${f.hue}, 75%, 60%, ${alpha*.5})`);
      g.addColorStop(1, 'transparent');
      c.fillStyle = g;
      c.beginPath();
      c.arc(px, py, sz, 0, TAU);
      c.fill();
    }

    c.globalCompositeOperation = 'source-over';

    // ===== 6. 星星 =====
    for (const s of stars) {
      if (!RM) {
        s.x += s.vx*dt*22;
        s.y += s.vy*dt*22;
        if (s.x<-6) s.x = W+6;
        if (s.x>W+6) s.x = -6;
        if (s.y<-6) s.y = H+6;
        if (s.y>H+6) s.y = -6;
      }
      const tw = RM ? 1 : 1-P.twinkle*.45 + P.twinkle*.45*Math.sin(t*.001*s.sp+s.ph);
      const rawX = s.x + oxMid*(s.z*.9+.1);
      const rawY = s.y + oyMid*(s.z*.9+.1);

      const finalA = clamp(s.a*tw*globalBreath,0,1);

      const g = lensStretch(rawX, rawY, bh);

      if (g.inside && g.stretch > 1) {
        const arcLen = g.stretch;
        const curvature = bh.curvature;
        const offset = arcLen / curvature;

        const dirX = (bh.cx - rawX) / g.dist;
        const dirY = (bh.cy - rawY) / g.dist;
        const arcCx = rawX + dirX * offset;
        const arcCy = rawY + dirY * offset;

        const starAng = Math.atan2(rawY - arcCy, rawX - arcCx);
        const halfSpan = arcLen / offset / 2;
        const startAng = starAng - halfSpan;
        const endAng = starAng + halfSpan;

        const ex1 = arcCx + Math.cos(startAng) * offset;
        const ey1 = arcCy + Math.sin(startAng) * offset;
        const ex2 = arcCx + Math.cos(endAng) * offset;
        const ey2 = arcCy + Math.sin(endAng) * offset;

        const lg = c.createLinearGradient(ex1, ey1, ex2, ey2);
        lg.addColorStop(0, 'transparent');
        lg.addColorStop(0.5, `rgba(${s.c},${finalA})`);
        lg.addColorStop(1, 'transparent');

        c.strokeStyle = lg;
        c.lineWidth = s.r * 1.1;
        c.lineCap = 'round';
        c.beginPath();
        c.arc(arcCx, arcCy, offset, startAng, endAng);
        c.stroke();

        c.globalAlpha = finalA * 0.8;
        c.fillStyle = `rgb(${s.c})`;
        c.beginPath();
        c.arc(rawX, rawY, s.r, 0, TAU);
        c.fill();
      } else {
        c.globalAlpha = finalA;
        c.fillStyle = 'rgb('+s.c+')';
        c.beginPath();
        c.arc(rawX, rawY, s.r*(.85+tw*.2), 0, TAU);
        c.fill();

        if (s.r > 1.9) {
          c.globalAlpha = clamp(s.a*tw*.5,0,1);
          const L = s.r*7;
          let lg2 = c.createLinearGradient(rawX-L,rawY,rawX+L,rawY);
          lg2.addColorStop(0,'transparent');
          lg2.addColorStop(.5,'rgba('+s.c+',.85)');
          lg2.addColorStop(1,'transparent');
          c.fillStyle = lg2; c.fillRect(rawX-L,rawY-.5,L*2,1);
          lg2 = c.createLinearGradient(rawX,rawY-L,rawX,rawY+L);
          lg2.addColorStop(0,'transparent');
          lg2.addColorStop(.5,'rgba('+s.c+',.85)');
          lg2.addColorStop(1,'transparent');
          c.fillStyle = lg2; c.fillRect(rawX-.5,rawY-L,1,L*2);
        }
      }
    }
    c.globalAlpha = 1;

    // ===== 7. 土星环星 =====
    for (const rs of ringStars) {
      drawRingStar(rs, t, oxMid, oyMid);
    }

    // ===== 8. 黑洞 =====
    drawBlackHole(bh);

    // ===== 9. 鼠标星尘 =====
    for (let i=mouseTrail.length-1; i>=0; i--) {
      const p = mouseTrail[i];
      p.life -= dt * 1.2;
      p.x += p.vx;
      p.y += p.vy;
      if (p.life <= 0) { mouseTrail.splice(i,1); continue; }
      const a = p.life * .9;
      c.globalAlpha = a;
      c.fillStyle = `hsl(${p.hue}, 90%, 82%)`;
      c.beginPath();
      c.arc(p.x + oxFast*.3, p.y + oyFast*.3, p.size * p.life, 0, TAU);
      c.fill();
      c.globalAlpha = a * .3;
      c.beginPath();
      c.arc(p.x + oxFast*.3, p.y + oyFast*.3, p.size * p.life * 2.5, 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
    if (mouseTrail.length > 350) mouseTrail.splice(0, mouseTrail.length - 350);

    // ===== 10. 流星 =====
    if (P.meteor>0 && !RM && Math.random() < dt*.5*P.meteor && met.length<4) {
      const dir = rnd()<.5?1:-1;
      met.push({
        x:rnd()*W, y:-40+rnd()*H*.4,
        vx: dir*(420+rnd()*520), vy: 230+rnd()*260,
        life:1, tl:[], flashed:false, fx:0, fy:0, flash:0,
        headHue: 20 + rnd()*40,
        tailHue: 200 + rnd()*80
      });
    }
    for (let i=met.length-1; i>=0; i--) {
      const m = met[i];
      m.x += m.vx*dt; m.y += m.vy*dt; m.life -= dt*.42;

      if (m.life <= 0.18 && !m.flashed) {
        m.flashed = true;
        m.fx = m.x; m.fy = m.y;
        m.flash = 1;
      }

      if (m.flash > 0) {
        m.flash -= dt * 2.2;
        if (m.flash > 0) {
          c.globalAlpha = m.flash * .8;
          const fr = (1 - m.flash) * 40;
          const fg = c.createRadialGradient(m.fx, m.fy, 0, m.fx, m.fy, fr);
          fg.addColorStop(0, 'rgba(255,255,255,' + (m.flash*.9) + ')');
          fg.addColorStop(.4, 'rgba(180,220,255,' + (m.flash*.4) + ')');
          fg.addColorStop(1, 'transparent');
          c.fillStyle = fg;
          c.beginPath(); c.arc(m.fx, m.fy, fr, 0, TAU); c.fill();
          c.globalAlpha = 1;
        }
      }

      if (m.life<=0 || m.y>H+80 || m.x<-120 || m.x>W+120) {
        if (m.flash > 0) continue;
        met.splice(i,1); continue;
      }
      m.tl.unshift([m.x,m.y]);
      if (m.tl.length>16) m.tl.pop();

      for (let j=1; j<m.tl.length; j++) {
        const prog = j / m.tl.length;
        const a = (1-prog) * m.life;
        const hue = m.headHue * (1-prog) + m.tailHue * prog;
        c.strokeStyle = `hsla(${hue}, 85%, 78%, ${a*.9})`;
        c.lineWidth = Math.max(.3, (1-prog)*2.1);
        c.beginPath(); c.moveTo(m.tl[j-1][0],m.tl[j-1][1]); c.lineTo(m.tl[j][0],m.tl[j][1]); c.stroke();
      }
      c.fillStyle = 'rgba(255,255,255,'+m.life+')';
      c.beginPath(); c.arc(m.x,m.y,1.5,0,TAU); c.fill();
    }
  }
  requestAnimationFrame(frame);
})();

// ============================================================
// 卡片：尘埃吸附鼠标
// ============================================================
function bindGlassMouse(card) {
  card.addEventListener('pointermove', e => {
    const r = card.getBoundingClientRect();
    const nx = (e.clientX - r.left) / r.width * 2 - 1;
    const ny = (e.clientY - r.top) / r.height * 2 - 1;
    card.style.setProperty('--mx-px', nx.toFixed(3));
    card.style.setProperty('--my-px', ny.toFixed(3));
  });
  card.addEventListener('pointerleave', () => {
    card.style.setProperty('--mx-px', '0');
    card.style.setProperty('--my-px', '0');
  });
}

// ============================================================
// FLAC 播放器
// ============================================================
const isTauri = !!window.__TAURI__;
const audio = document.getElementById('audio');
const tracksUl = document.getElementById('tracks');
const player = document.getElementById('player');
const disc = document.getElementById('disc');
const bar = document.getElementById('bar');
const barFill = document.getElementById('barFill');
const timeText = document.getElementById('timeText');

bindGlassMouse(player);
bindGlassMouse(tracksUl);

let playlist = [];
let currentIndex = -1;

function toPlayableUrl(path) {
  if (isTauri && window.__TAURI__.convertFileSrc) {
    return window.__TAURI__.convertFileSrc(path);
  }
  return path;
}
function getExt(path) {
  if (!path) return '';
  const m = path.match(/\.([a-zA-Z0-9]+)$/);
  return m ? m[1].toUpperCase() : '';
}

function getTrackItems() {
  return [...tracksUl.querySelectorAll(':scope > li')];
}

async function loadDefaultMusic() {
  if (isTauri) {
    try {
      const tracks = await window.__TAURI__.invoke('scan_default_music');
      const list = tracks.map(t => ({
        name: t.name,
        url: toPlayableUrl(t.path),
        ext: getExt(t.path)
      }));
      loadPlaylist('E:\\muisc\\倾听', list);
    } catch (e) {
      document.getElementById('npTag').textContent = '默认目录读取失败';
      document.getElementById('npTtl').textContent = '—';
      document.getElementById('npArt').textContent = String(e);
      tracksUl.innerHTML = `<div class="stardust-layer"></div><li style="justify-content:center;color:rgba(255,255,255,.55);cursor:default">默认目录读取失败：${String(e)}</li>`;
    }
  } else {
    document.getElementById('npTag').textContent = '浏览器环境';
    document.getElementById('npTtl').textContent = '—';
    document.getElementById('npArt').textContent = '请使用桌面版读取本地音乐';
    tracksUl.innerHTML = `<div class="stardust-layer"></div><li style="justify-content:center;color:rgba(255,255,255,.55);cursor:default">请使用桌面版读取本地音乐</li>`;
  }
}
window.addEventListener('load', loadDefaultMusic);

function loadPlaylist(folder, list) {
  playlist = list || [];
  if (playlist.length === 0) {
    tracksUl.innerHTML = `<div class="stardust-layer"></div><li style="justify-content:center;color:rgba(255,255,255,.55);cursor:default">该文件夹没有 FLAC / MP3 文件</li>`;
    document.getElementById('npTag').textContent = '未找到音乐';
    document.getElementById('npTtl').textContent = '—';
    document.getElementById('npArt').textContent = folder;
    return;
  }
  tracksUl.innerHTML = '<div class="stardust-layer"></div>';
  playlist.forEach((t,i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${String(i+1).padStart(2,'0')}</span>
      <span class="t">${escapeHtml(t.name)}</span>
      <span class="a">${t.ext || 'AUDIO'}</span>`;
    li.onclick = () => playTrack(i);
    tracksUl.appendChild(li);
  });
  document.getElementById('npTag').textContent = '已加载';
  document.getElementById('npTtl').textContent = `共 ${playlist.length} 首`;
  document.getElementById('npArt').textContent = folder;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function playTrack(i) {
  if (i<0 || i>=playlist.length) return;
  currentIndex = i;

  const items = getTrackItems();
  items.forEach((li, idx) => li.classList.toggle('on', idx === i));

  console.log('[播放]', playlist[i].url);
  audio.src = playlist[i].url;
  audio.load();
  const p = audio.play();
  if (p && p.catch) {
    p.catch(err => {
      console.error('播放失败：', err);
      alert('播放失败：' + err.message);
    });
  }
  document.getElementById('npTag').textContent = `TRACK ${String(i+1).padStart(2,'0')} / ${playlist.length}`;
  document.getElementById('npTtl').textContent = playlist[i].name;
  document.getElementById('npArt').textContent = (playlist[i].ext||'AUDIO')+' · 本地文件';
  player.classList.add('playing');
  disc.classList.add('spin');
  disc.classList.remove('paused');

  if (items[i]) items[i].scrollIntoView({block:'nearest',behavior:'smooth'});
}

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  barFill.style.width = (audio.currentTime/audio.duration*100)+'%';
  timeText.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
});
function fmt(t) {
  if (!t || isNaN(t)) return '00:00';
  const m = Math.floor(t/60), s = Math.floor(t%60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
bar.addEventListener('click', e => {
  if (!audio.duration) return;
  const r = bar.getBoundingClientRect();
  audio.currentTime = ((e.clientX-r.left)/r.width)*audio.duration;
});
audio.addEventListener('ended', () => {
  if (currentIndex+1 < playlist.length) playTrack(currentIndex+1);
  else { player.classList.remove('playing'); disc.classList.add('paused'); }
});
audio.addEventListener('pause', () => {
  player.classList.remove('playing');
  disc.classList.add('paused');
});
audio.addEventListener('play', () => {
  player.classList.add('playing');
  disc.classList.add('spin');
  disc.classList.remove('paused');
});

document.getElementById('disc').addEventListener('click', () => {
  if (playlist.length === 0) return;
  if (!audio.src) return;
  if (audio.paused) audio.play();
  else audio.pause();
});
</script>
